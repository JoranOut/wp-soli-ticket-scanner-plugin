name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Allows re-verifying a branch on demand, e.g. after a merge performed with
  # GITHUB_TOKEN (which does not trigger the push event).
  workflow_dispatch:

jobs:
  e2e:
    # One leg per WordPress version we claim to support. `floor` is the oldest
    # supported branch, declared once in package.json as wordpress.requiresAtLeast
    # and resolved here to its newest patch; `latest` is whatever wordpress.org
    # currently ships. Production runs behind staging, so testing only the newest
    # release would leave the version actually serving soli.nl unexercised.
    name: e2e (WP ${{ matrix.channel }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        channel: [latest, floor]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Resolve the WordPress version for this leg
        id: wp
        run: |
          set -euo pipefail
          FLOOR_BRANCH=$(node -p "require('./package.json').wordpress.requiresAtLeast")
          LATEST=$(curl -sf https://api.wordpress.org/core/version-check/1.7/ \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).offers[0].current))')

          if [ "${{ matrix.channel }}" = "latest" ]; then
            VERSION="$LATEST"
          else
            # Newest patch on the floor branch, so security fixes are picked up
            # without anyone editing the matrix.
            VERSION=$(curl -sf https://api.wordpress.org/core/stable-check/1.0/ \
              | FLOOR="$FLOOR_BRANCH" node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
                  const f=process.env.FLOOR;
                  const k=v=>v.split(".").map(Number);
                  const c=Object.keys(JSON.parse(s)).filter(v=>v===f||v.startsWith(f+"."));
                  if(!c.length){console.error("no releases on branch "+f);process.exit(1);}
                  c.sort((a,b)=>{const x=k(a),y=k(b);for(let i=0;i<3;i++){if((x[i]||0)!==(y[i]||0))return (x[i]||0)-(y[i]||0);}return 0;});
                  console.log(c[c.length-1]);
                })')
          fi

          test -n "$VERSION"

          # Always an explicit zip, including on the `latest` leg. Leaving
          # WP_ENV_CORE empty lets wp-env resolve core through the
          # WordPress/WordPress git mirror, and on 2026-08-12 WordPress shipped
          # 7.0.4 without pushing the tag - `fatal: couldn't find remote ref
          # 7.0.4` took down CI in every Soli repo at once. The zips on
          # wordpress.org are published with the release itself.
          #
          # WP_ENV_CORE overrides .wp-env.json's core pin: wp-env applies the
          # environment variables last, onto env.development and env.tests both
          # (lib/config/parse-config.js). Verified locally - with the file
          # pinning 7.0.4 and WP_ENV_CORE set to the 6.9.7 zip, `wp core version`
          # reported 6.9.7. The verify step below re-checks it every run.
          CORE="https://wordpress.org/wordpress-${VERSION}.zip"

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "WP_ENV_CORE=${CORE}" >> $GITHUB_ENV
          echo "Leg '${{ matrix.channel }}' targets WordPress ${VERSION}"

      # publish.js zips whatever is committed under assets/, so a src/ change
      # that was never rebuilt would ship silently. Keep the two in sync here
      # rather than only at publish time. This also produces the assets the
      # suite loads, so it has to run before wp-env starts.
      - name: Verify assets/ matches a fresh build of src/
        run: |
          npm run build
          if [ -n "$(git status --porcelain -- assets)" ]; then
            git --no-pager diff --stat -- assets
            git status --porcelain -- assets
            echo "::error::assets/ is out of date with src/. Run 'npm run build' and commit the result."
            exit 1
          fi
          echo "assets/ is up to date."

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Runs .wp-env-setup.sh through lifecycleScripts.afterStart, which sets
      # pretty permalinks and seeds the fixtures. Without it /scanner/{slug}
      # 404s in Apache and the route specs test nothing.
      - name: Start wp-env
        run: npm run env:start

      - name: Verify wp-env installed the version this leg targets
        run: |
          set -euo pipefail
          # The release workflows stamp 'requires' and 'tested' from these same
          # two numbers, so if wp-env quietly installed something else the plugin
          # would advertise compatibility it never demonstrated.
          # Note the run container is tests-cli, not tests.
          RAW=$(npx wp-env run tests-cli wp core version 2>&1 | tr -d '\r')
          ACTUAL=$(printf '%s\n' "$RAW" | grep -oE '^[0-9]+\.[0-9]+(\.[0-9]+)?$' | head -1 || true)
          WANTED="${{ steps.wp.outputs.version }}"

          if [ -z "$ACTUAL" ]; then
            echo "::error::could not read the WordPress version from wp-env. Raw output:"
            printf '%s\n' "$RAW"
            exit 1
          fi

          echo "wp-env installed WordPress ${ACTUAL}; this leg targets ${WANTED}"
          echo "WP ${ACTUAL} (${{ matrix.channel }})" >> "$GITHUB_STEP_SUMMARY"

          if [ "$ACTUAL" != "$WANTED" ]; then
            echo "::error::wp-env installed ${ACTUAL} but this leg targets ${WANTED}."
            echo "::error::Usual causes: WP_ENV_CORE stopped overriding .wp-env.json's core pin,"
            echo "::error::or WordPress released mid-run (re-run the job)."
            exit 1
          fi

      - name: Run Playwright tests
        run: npm run test:e2e
        env:
          # Chromium (the only configured project) is already installed with its
          # system deps above; skip wp-scripts' re-download of every browser.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 'true'

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-${{ matrix.channel }}
          path: playwright-report/
          retention-days: 7

  # Single required status check. The branch ruleset requires the context `test`,
  # and a matrix job reports one context per leg (`e2e (WP latest)`, `e2e (WP
  # floor)`) rather than a bare one - so this job exists to collapse the matrix
  # back into the name the ruleset expects. Renaming the required check instead
  # would need a careful non-atomic ruleset change; this needs none.
  test:
    name: test
    runs-on: ubuntu-latest
    needs: e2e
    if: always()

    steps:
      - name: Require every WordPress version to pass
        run: |
          set -euo pipefail
          RESULT="${{ needs.e2e.result }}"
          if [ "$RESULT" != "success" ]; then
            echo "::error::the e2e matrix did not pass (result: ${RESULT})"
            exit 1
          fi
          echo "All WordPress versions passed."
