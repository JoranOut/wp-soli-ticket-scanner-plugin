name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Allows re-verifying a branch on demand, e.g. after a merge performed with
  # GITHUB_TOKEN (which does not trigger the push event).
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # publish.js zips whatever is committed under assets/, so a src/ change
      # that was never rebuilt would ship silently. Keep the two in sync here
      # rather than only at publish time.
      - name: Verify assets/ matches a fresh build of src/
        run: |
          npm run build
          if [ -n "$(git status --porcelain -- assets)" ]; then
            git --no-pager diff --stat -- assets
            git status --porcelain -- assets
            echo "::error::assets/ is out of date with src/. Run 'npm run build' and commit the result."
            exit 1
          fi
          echo "assets/ is up to date."

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start wp-env
        run: npm run env:start

      - name: Run Playwright tests
        run: npm run test:e2e
        env:
          # Chromium (the only configured project) is already installed with its
          # system deps above; skip wp-scripts' re-download of every browser.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 'true'

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
